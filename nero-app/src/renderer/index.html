        </svg>
      </button>
    </div>
  </div>

<script>
    const { ipcRenderer, shell } = require('electron');
    
    // 1. Busca as informações de conexão (PIN e IP da rede local) do main.ts
    async function loadConnectionInfo() {
      try {
        const info = await ipcRenderer.invoke('get-connection-info');
        // Atualiza a interface com o PIN e o Link da rede gerados pelo PC
        document.getElementById('pin-display').innerText = info.pin;
        document.getElementById('link-display').innerText = info.link;
      } catch (error) {
        console.error("Erro ao carregar informações de conexão:", error);
      }
    }

    // Chama a função assim que o HTML carregar
    loadConnectionInfo();

    // 2. Atualiza o status de conexão com o League of Legends
    const statusIndicator = document.querySelector('.status-indicator');
    const statusText = document.querySelector('.status-box span');

    ipcRenderer.on('lcu-status', (event, data) => {
      if (data.status === 'connected') {
        statusIndicator.style.backgroundColor = '#2ea043'; // Verde
        statusText.innerText = 'Conectado';
        statusText.style.color = '#c9d1d9';
      } else {
        statusIndicator.style.backgroundColor = '#d73a49'; // Vermelho
        statusText.innerText = 'League não conectado';
        statusText.style.color = '#8b949e';
      }
    });

    // 3. Abre links externos (Discord/Instagram) no navegador padrão do PC
    document.querySelectorAll('.btn[data-url]').forEach(button => {
      button.addEventListener('click', () => {
        const url = button.getAttribute('data-url');
        shell.openExternal(url);
      });
    });
  </script>
</body>
</html>
